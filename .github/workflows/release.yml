name: Release

# Tag a release to build and publish the custom Kong image:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      kong_version:
        description: "Base Kong image version"
        default: "3.9"

permissions:
  contents: read
  packages: write

env:
  KONG_VERSION: ${{ github.event.inputs.kong_version || '3.9' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v5
      - run: luarocks install luacheck && luarocks install busted
      - run: luacheck kong spec
      - run: busted --verbose

  image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optional: also push to Azure Container Registry when these secrets exist.
      - name: Log in to ACR
        if: ${{ secrets.ACR_LOGIN_SERVER != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.ACR_LOGIN_SERVER != '' && format('{0}/kong-hmac', secrets.ACR_LOGIN_SERVER) || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=kong${{ env.KONG_VERSION }}-{{sha}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: KONG_VERSION=${{ env.KONG_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Published image tags"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Roll out control plane first, then data plane, then \`deck gateway sync\`."
          } >> "$GITHUB_STEP_SUMMARY"
