name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v5
      - run: luarocks install luacheck
      - run: luacheck kong spec

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        luaVersion: ["5.3", "5.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v11
        with:
          luaVersion: ${{ matrix.luaVersion }}
      - uses: leafo/gh-actions-luarocks@v5
      - run: luarocks install busted
      - run: busted --verbose

  image-build:
    # Proves deploy/Dockerfile still builds; does not push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          build-args: KONG_VERSION=3.9
          tags: kong-hmac:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration-pongo:
    # Real Kong node + the plugin, driven by Kong's Pongo harness.
    # Non-blocking: it needs Pongo-style specs under spec/ (spec.helpers based),
    # which this repo does not ship yet. Kept here as the wiring to turn on.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: kong-plugin-hmac-auth
      - run: git clone --depth 1 https://github.com/Kong/kong-pongo pongo
      - name: pongo run
        working-directory: kong-plugin-hmac-auth
        run: |
          export PATH="$PATH:$GITHUB_WORKSPACE/pongo/pongo"
          pongo run -- --verbose
